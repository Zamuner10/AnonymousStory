version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: anonymous_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: anonymous_bakcend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/anonymous_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: my-super-secret-key-for-jwt-token-generation-123456
      GMAIL_USERNAME: dummy@gmail.com
      GMAIL_PASSWORD: dummypassword
      APP_COOKIE_SECURE: "false"

volumes:
  pgdata:

