spring.application.name=anonymousstories

# Configuração do servidor
server.port=8080


# JPA / Hibernate (Estrutura Preparada)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Segredo do JWT (Obrigatório vir de variável de ambiente, sem fallback inseguro)
api.security.token.secret=${JWT_SECRET:minha_chave_secreta_super_segura_para_teste_123}

# Configuração do Servidor E-mail (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Definição de cookie e URLs
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.base-url=http://localhost:8080



#Banco de Dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect